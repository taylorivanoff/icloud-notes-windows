name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-version:
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: |
          set -e
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD^ HEAD)
          else
            CHANGED=$(git show --pretty="" --name-only HEAD)
          fi

          NON_README=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            base=$(basename "$file")
            if [[ ! "$base" =~ ^[Rr][Ee][Aa][Dd][Mm][Ee].*\.[Mm][Dd]$ ]]; then
              NON_README=1
              break
            fi
          done <<< "$CHANGED"

          if [ -n "$CHANGED" ] && [ -z "$NON_README" ]; then
            echo "README-only change; skipping version bump and release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT=$(jq -r .version package.json)
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            OLD=$(git show HEAD^:package.json | jq -r .version)
          else
            OLD=""
          fi

          if [ -n "$OLD" ] && [ "$OLD" = "$CURRENT" ]; then
            node scripts/bump-version.cjs patch
            CURRENT=$(jq -r .version package.json)
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
            for lock in bun.lock src-tauri/Cargo.lock; do
              if [ -f "$lock" ]; then git add "$lock"; fi
            done
            git commit -m "chore: bump version to ${CURRENT}"
            git push
            echo "Auto-bumped version to ${CURRENT}"
          else
            echo "Using version ${CURRENT} (already bumped or initial)"
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-version.outputs.ref }}
          path: icloud-apps/icloud-notes-windows
          fetch-depth: 0
      - name: Checkout tauri-tray-base
        uses: actions/checkout@v4
        with:
          repository: taylorivanoff/tauri-tray-base
          path: tauri-tray-base
      - name: Checkout tauri-icloud-base
        uses: actions/checkout@v4
        with:
          repository: taylorivanoff/tauri-icloud-base
          path: tauri-icloud-base
      - name: Generate changelog
        id: changelog
        working-directory: icloud-apps/icloud-notes-windows
        shell: bash
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" -10)
          else
            COMMITS=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: icloud-apps/icloud-notes-windows
        run: |
          bun install
          bun run release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          files: |
            icloud-apps/icloud-notes-windows/src-tauri/target/release/bundle/nsis/*.exe
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.commits }}

            Tauri / WebView2 build (no bundled Chromium).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
